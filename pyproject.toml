[project]
name = "custody"
version = "1.0.0"
description = "Verifiable Clinical Knowledge Object Framework for Privacy-Preserving Multi-Centre Learning"
authors = [{name = "The CUSTODY authors"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pandas-stubs>=2.0.0",
    "types-PyYAML>=6.0.0",
    "pyyaml>=6.0",
]
plotting = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
# CTGAN and TVAE come from sdv (sktime-free). synthcity was removed
# 2026-08-11: synthcity 0.2.4 -> tsai 0.2.17 -> sktime 0.8.0, an sdist-only
# package whose legacy setup.py imports the removed `pkg_resources`, so the
# extra never built on any current interpreter.
#
# Arm A1's TabDDPM is therefore ours (WP7, 2026-08-11): `tabddpm.py` runs on
# the PPG's diffusion core with conditioning off, per spec v3 §5's A1
# amendment, and needs torch rather than synthcity. A1 is three generators.
synthetic = [
    "sdv>=1.10.0",
    "torch>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/custody"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["custody"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "statsmodels.*"]
ignore_missing_imports = true
